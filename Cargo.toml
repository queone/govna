[package]
name = "govna"
version = "0.1.0"
edition = "2024"

[dependencies]
# Reserved for future per-subcommand flag parsing (e.g. render-canon's
# --flavor/--stack/--module-path). AC2's top-level dispatch is hand-rolled
# against std::env::args() for exact stream/exit-code parity with governa's
# Go CLI, so clap isn't invoked yet.
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "govna"
path = "src/main.rs"
