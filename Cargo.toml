[package]
name = "govna"
version = "0.2.0"
edition = "2024"

[dependencies]
# Reserved for a future subcommand whose flag surface doesn't need governa's
# exact stream/exit-code parity. render-canon (AC4) stayed hand-rolled against
# std::env::args(), matching AC2's top-level dispatch, since AT8 needs exact
# help-text control that clap's own conventions would fight.
clap = { version = "4", features = ["derive"] }
# Embeds templates/ into the binary at compile time (AC4). No extra features:
# the whole folder is embedded unfiltered, so include/exclude patterns aren't needed.
rust-embed = "8"

[[bin]]
name = "govna"
path = "src/main.rs"
